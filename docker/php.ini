; Zone and item pages fan out across loottable/spawn joins over a 118k-item DB,
; so give PHP more headroom than the 128M default.
memory_limit = 512M
max_execution_time = 120

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
