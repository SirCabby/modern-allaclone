user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # When fronted by a reverse proxy every request arrives from the proxy's IP.
    # Recover the real client so rate limiting counts per visitor, not per proxy.
    # Only private ranges are trusted, so a forged header from outside is ignored.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Page views are cheap (cached), but the DB-backed search endpoints are not.
    limit_req_zone $binary_remote_addr zone=allaclone_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=allaclone_search:10m rate=4r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=allaclone_conn:10m;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        limit_conn allaclone_conn 24;

        # Public site: keep it out of frames, stop MIME sniffing, and don't leak
        # full URLs to the CDNs the layout pulls fonts from.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # 'unsafe-eval' is required by Alpine.js (it compiles expressions with
        # new Function); 'unsafe-inline' by the theme/tooltip inline scripts.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Item/spell icons and built assets are immutable — let browsers keep them.
        location ~* ^/(build|img)/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Typeahead hits the DB on every keystroke — the tightest limit goes here.
        location = /search/suggest {
            limit_req zone=allaclone_search burst=8 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location / {
            limit_req zone=allaclone_general burst=60 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Never serve dotfiles (.env, .git) even if they land in the web root.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
